; Standalone sub-project: WeMOS D1 Mini + ST7789 240x240 IPS display over SPI.
;
; Build/upload from this directory:
;   ~/.platformio/penv/bin/pio run -e d1_mini -t upload
;   ~/.platformio/penv/bin/pio device monitor
;
; Wiring (ST7789 -> D1 Mini):
;   GND -> GND
;   VCC -> 3V3
;   SCL -> D5  (GPIO14, HSPI SCLK)   hardware SPI clock, not remappable
;   SDA -> D7  (GPIO13, HSPI MOSI)   hardware SPI data, not remappable
;   RES -> D4  (GPIO2)               reset
;   DC  -> D3  (GPIO0)               data/command
;   BLK -> D8  (GPIO15)              backlight enable, HIGH = on
;
; The panel has no CS line, so CS is tied low on the module: TFT_CS is -1 and
; the controller has to be clocked in SPI_MODE2. Pin defines live in src/main.cpp.

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
