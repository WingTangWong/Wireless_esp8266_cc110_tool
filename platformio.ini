[platformio]
; Real Wi-Fi credentials live in secrets.ini (git-ignored).
; Copy secrets.ini.example -> secrets.ini and fill it in. If secrets.ini is
; absent the [wifi] placeholders below are used.
; ports.ini (git-ignored) optionally pins upload_port per env so the right
; firmware always reaches the right board - see ports.ini.example.
extra_configs =
    secrets.ini
    ports.ini

[wifi]
sta_ssid = CHANGE_ME_SSID
sta_pass = CHANGE_ME_PASSWORD
ap_ssid = cc1101-setup
ap_pass = CHANGE_ME_AP_PASSWORD

[remote]
; target_ssid: pin one main unit exactly, or leave empty to join the strongest
; SSID starting with "<wifi.ap_ssid>-".
target_ssid =
main_ip = 192.168.4.1

; ---------------------------------------------------------------------------
; Main unit: WeMOS D1 Mini + CC1101 318 MHz tool
; ---------------------------------------------------------------------------
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
extra_scripts = pre:scripts/version.py
build_src_filter = +<*> -<remote/>
build_flags =
    -DCFG_WIFI_SSID='"${wifi.sta_ssid}"'
    -DCFG_WIFI_PASS='"${wifi.sta_pass}"'
    -DCFG_WIFI_AP_SSID='"${wifi.ap_ssid}"'
    -DCFG_WIFI_AP_PASS='"${wifi.ap_pass}"'
lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib @ ^3.0.2

; Same firmware with serial tracing on 115200. `pio run -e d1_mini_debug -t upload`
[env:d1_mini_debug]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    -DCC1101_TRACE

; ---------------------------------------------------------------------------
; Remote: a second D1 Mini (no CC1101) - OLED + buttons, talks to the main
; unit over Wi-Fi. Paired by the shared ap_ssid/ap_pass from secrets.ini.
; ---------------------------------------------------------------------------
[env:d1_mini_remote]
platform = espressif8266
board = d1_mini
framework = arduino
extra_scripts = pre:scripts/version.py
build_src_filter = -<*> +<remote/>
build_flags =
    -DCFG_WIFI_AP_SSID='"${wifi.ap_ssid}"'
    -DCFG_WIFI_AP_PASS='"${wifi.ap_pass}"'
    -DCFG_REMOTE_TARGET_SSID='"${remote.target_ssid}"'
    -DCFG_REMOTE_MAIN_IP='"${remote.main_ip}"'
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1

; Display-less remote (status over serial + LED only)
[env:d1_mini_remote_headless]
extends = env:d1_mini_remote
build_flags =
    ${env:d1_mini_remote.build_flags}
    -DREMOTE_HEADLESS
